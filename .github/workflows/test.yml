name: Test

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true
        description: 'Primary Node.js version to test on (matches the service Dockerfile)'
      node-version-next:
        type: string
        default: '26'
        description: 'Forward-looking Node.js version, run with continue-on-error. Empty = skip.'
      working-directory:
        type: string
        default: '.'
        description: 'Directory containing package.json / package-lock.json'
      apt-packages:
        type: string
        default: ''
        description: 'Space-separated apt packages the tests need (e.g. gdal-bin). Empty = install nothing.'

jobs:
  test:
    name: Test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    # A test run has no business taking longer than this — the slowest job
    # across all services currently finishes in under 30 seconds. Without a
    # limit, a dependency without a prebuilt binary for the target Node version
    # gets compiled from source and the job hangs until the 6 hour default,
    # burning CI minutes and leaving the check pending. continue-on-error
    # covers a failure, not a hang.
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-version-next == '' && format('["{0}"]', inputs.node-version) || format('["{0}","{1}"]', inputs.node-version, inputs.node-version-next)) }}

    # The forward-looking version is informational only — it must never block a merge.
    continue-on-error: ${{ matrix.node-version == inputs.node-version-next }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install system packages
        # For services whose code shells out to a command line tool that the
        # service image installs but a runner does not — dataconnector-utils
        # converts uploads with GDAL's ogr2ogr, for instance. Without this the
        # affected tests skip themselves and the branch goes untested in CI.
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

      - name: Configure private registry
        # Most services depend on @maptoolkit/* packages from GitHub Packages.
        # Written to ~/.npmrc (like the Dockerfiles do) so it never lands in the
        # working tree.
        run: |
          echo "@maptoolkit:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Coverage report
        # Only on the primary version — running it in every matrix job would
        # produce several different numbers for the same commit. Informational:
        # a coverage problem must not turn a green test run red.
        if: matrix.node-version == inputs.node-version
        continue-on-error: true
        run: |
          if [ "$(npm pkg get scripts.coverage)" = "{}" ]; then
            echo "::warning::No coverage script defined — skipping."
            echo '> ⚠️ No `coverage` script defined — skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## 📊 Coverage report" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          npm run coverage --silent 2>&1 | tee coverage-output.txt

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Compact headline from the machine-readable summary, if present.
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const fs = require("fs");
              const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json")).total;
              const line = `**Summary:** branches ${t.branches.pct}% (${t.branches.covered}/${t.branches.total}) — ` +
                `lines ${t.lines.pct}% (${t.lines.covered}/${t.lines.total}) — ` +
                `functions ${t.functions.pct}% (${t.functions.covered}/${t.functions.total})`;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n" + line + "\n");
              console.log(line);
            '
          fi
