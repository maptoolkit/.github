name: Publish Docs

on:
  workflow_call:
    inputs:
      source-path:
        description: "Markdown file in the calling repo to publish"
        type: string
        default: "./README.md"
      front-matter:
        description: "Hugo front matter (YAML, without the --- delimiters) to prepend. Keeps it out of the README on GitHub."
        type: string
        default: ""
      docs-path:
        description: "Target file in maptoolkit/docs, e.g. docs/content/third-party-libraries/maplibre/style-control.md"
        type: string
        required: true
    secrets:
      DOCS_REPO_TOKEN:
        required: true

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout docs repo
        uses: actions/checkout@v6
        with:
          repository: maptoolkit/docs
          path: docs-repo
          token: ${{ secrets.DOCS_REPO_TOKEN }}

      - name: Write files
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
          DOCS_PATH: ${{ inputs.docs-path }}
          FRONT_MATTER: ${{ inputs.front-matter }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          target="docs-repo/$DOCS_PATH"
          mkdir -p "$(dirname "$target")"
          : > "$target"
          has_title=0
          # Notice for editors in maptoolkit/docs. As a YAML comment in the front matter it never reaches the rendered page or its HTML source.
          # The front-matter input is passed in by each repo's .github/workflows/publish-docs.yml (github.workflow_ref would point to release.yml instead).
          NOTICE="#
          # This file is generated from https://github.com/$SOURCE_REPO/blob/HEAD/${SOURCE_PATH#./}
          # by the publish-docs workflow and overwritten on every release."
          if [ -n "$FRONT_MATTER" ]; then
            NOTICE="$NOTICE
          # The front matter is defined in https://github.com/$SOURCE_REPO/blob/HEAD/.github/workflows/publish-docs.yml"
          fi
          export NOTICE="$NOTICE
          # Please don't edit it here, change the source instead.
          #"
          if [ -n "$FRONT_MATTER" ]; then
            if [ "$(head -n 1 "$SOURCE_PATH")" = "---" ]; then
              echo "::error::$SOURCE_PATH already has front matter, remove it or drop the front-matter input"
              exit 1
            fi
            printf -- '---\n%s\n%s\n---\n\n' "$NOTICE" "${FRONT_MATTER%$'\n'}" > "$target"
            if printf '%s\n' "$FRONT_MATTER" | grep -q '^title:'; then has_title=1; fi
          fi
          # Hugo renders the front matter title as H1, so drop the README's own H1 to avoid a duplicate heading.
          # GitHub doesn't render iframes, so the demo embed is only added to the docs page, below the first [Live demo](...) link.
          awk -v has_title="$has_title" '
            NR == 1 && $0 == "---" { fm = 1; print; print ENVIRON["NOTICE"]; next }
            fm == 1 { if ($0 == "---") fm = 2; else if ($0 ~ /^title:/) has_title = 1; print; next }
            /^(```|~~~)/ { fence = !fence }
            has_title && !dropped && !fence && /^# / { dropped = 1; skip_blank = 1; next }
            skip_blank && /^[[:space:]]*$/ { skip_blank = 0; next }
            { skip_blank = 0; print }
            !embedded && !fence && match(tolower($0), /\[live demo\]\([^)]+\)/) {
              embedded = 1
              url = substr($0, RSTART + 12, RLENGTH - 13)
              print ""
              print "<iframe src=\"" url "\" title=\"Live demo\" style=\"width:100%;height:500px;border:none;border-radius:6px;\"></iframe>"
            }
          ' "$SOURCE_PATH" >> "$target"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: docs-repo
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          add-paths: ${{ inputs.docs-path }}
          branch: docs/${{ github.event.repository.name }}
          delete-branch: true
          commit-message: "chore: update ${{ github.event.repository.name }} docs (${{ github.ref_name }})"
          title: "chore: update ${{ github.event.repository.name }} docs"
          body: |
            Automatically generated from ${{ github.repository }}@${{ github.sha }}.
          author: maptoolkit-ops <technik@maptoolkit.com>
          committer: maptoolkit-ops <technik@maptoolkit.com>
