name: NPM Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
        description: "Node.js version to use"
      registry-url:
        type: string
        default: "https://registry.npmjs.org"
        description: "npm registry to publish to (e.g. https://npm.pkg.github.com for GitHub Packages)"
      scope:
        type: string
        default: ""
        description: "Package scope to authenticate for the registry (e.g. '@maptoolkit'), required for GitHub Packages"
    secrets:
      NPM_TOKEN:
        required: false
        description: "Registry token; falls back to GITHUB_TOKEN (sufficient for GitHub Packages)"
    outputs:
      published:
        description: "'true' if changesets published at least one package to npm"
        value: ${{ jobs.release.outputs.published }}

jobs:
  release:
    runs-on: ubuntu-latest
    # No job-level permissions: they are inherited from the caller, which must grant
    # contents: write and pull-requests: write (plus packages: write for GitHub Packages).
    # Declaring packages: write here would break callers that don't grant it.
    outputs:
      # changesets/action only detects publishes via "New tag:" lines, which @changesets/cli v3 no longer prints, so rely on the created tags instead.
      published: ${{ steps.tags.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}
      - run: npm ci
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Push release tags and create GitHub releases
        id: tags
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -n "$tags" ]; then
            git push origin --tags
            for tag in $tags; do
              gh release create "$tag" --title "$tag" --generate-notes
            done
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
