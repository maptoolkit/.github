name: Release

on:
  workflow_call:
    inputs:
      type:
        description: 'Release type'
        type: string
        required: true
    outputs:
      tag:
        description: 'The created release tag (e.g. v1.2.3)'
        value: ${{ jobs.release.outputs.tag }}

jobs:
  release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate input
        env:
          RELEASE_TYPE: ${{ inputs.type }}
        run: |
          if [[ ! "$RELEASE_TYPE" =~ ^(patch|minor|major)$ ]]; then
            echo "Invalid release type: '$RELEASE_TYPE' — must be patch, minor or major"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        env:
          RELEASE_TYPE: ${{ inputs.type }}
        run: npm version "$RELEASE_TYPE" --no-git-tag-version

      - name: Generate changelog entry
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION#v}"
          DATE=$(date +%Y-%m-%d)
          REPO="${{ github.event.repository.name }}"
          # Restrict to well-formed v<digit> tags and let git do the version sort:
          # `sort -V` ranks a malformed tag like "v.0.23.1" *above* "v1.14.42",
          # which picks an ancient tag as PREV_TAG and dumps the whole history
          # into the changelog.
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)

          ENTRIES=""
          # --no-merges, not --first-parent: with a "Merge branch 'main'" sync
          # merge the real commits sit on the second parent, so --first-parent
          # reports only the merge itself and hides the actual work.
          GIT_LOG_OUTPUT=$(git log "${PREV_TAG:+$PREV_TAG..}HEAD" --pretty=tformat:"%s|%h" --no-merges)

          while IFS='|' read -r msg sha; do
            [ -z "$msg" ] && continue
            msg="${msg^}"
            # Normalize GitHub merge commits: replace "Merge pull request #XX from ..." with PR title
            if [[ $msg =~ ^Merge[[:space:]]pull[[:space:]]request[[:space:]]#([0-9]+)[[:space:]]from ]]; then
              pr_num="${BASH_REMATCH[1]}"
              pr_title=$(gh api repos/maptoolkit/$REPO/pulls/$pr_num -q '.title' 2>/dev/null || echo "")
              [ -n "$pr_title" ] && msg="${pr_title^} #${pr_num}"
            fi
            if [[ $msg =~ \#([0-9]+) ]]; then
              pr_num="${BASH_REMATCH[1]}"
              author=$(gh api repos/maptoolkit/$REPO/pulls/$pr_num -q '.user.login' 2>/dev/null || echo "")
              # Strip "(#12)" as a whole — squash-merge subjects carry the PR
              # number in parens, and removing only "#12" leaves a stray "()".
              msg_clean=$(echo "$msg" | sed -E "s/ ?\(#[0-9]+\)//; s/ ?#[0-9]+//; s/[[:space:]]+$//")
              if [ -n "$author" ]; then
                ENTRIES="$ENTRIES\n- $msg_clean by [@$author](https://github.com/$author) in [#$pr_num](https://github.com/maptoolkit/$REPO/pull/$pr_num)"
              else
                ENTRIES="$ENTRIES\n- $msg_clean in [#$pr_num](https://github.com/maptoolkit/$REPO/pull/$pr_num)"
              fi
            else
              ENTRIES="$ENTRIES\n- $msg [$sha](https://github.com/maptoolkit/$REPO/commit/$sha)"
            fi
          done <<< "$GIT_LOG_OUTPUT"

          [ -z "$ENTRIES" ] && ENTRIES="\n- (no changes)"

          ENTRY="## ${TAG} - ${DATE}\n${ENTRIES}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          {
            echo "entry<<EOF"
            printf "%b" "$ENTRY"
            echo ""
            echo "EOF"
            echo "notes<<EOF"
            printf "%b" "$ENTRIES"
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        # Pass the entry through the environment, never inline: a commit message
        # containing a double quote would otherwise close the shell string and
        # the "(" of a markdown link becomes a syntax error.
        env:
          ENTRY: ${{ steps.changelog.outputs.entry }}
        run: |
          if [ -f CHANGELOG.md ]; then
            TEMP=$(mktemp)
            head -1 CHANGELOG.md > "$TEMP"
            printf "\n%b\n" "$ENTRY" >> "$TEMP"
            tail -n +2 CHANGELOG.md >> "$TEMP"
            mv "$TEMP" CHANGELOG.md
          else
            printf "# Changelog\n\n%b\n" "$ENTRY" > CHANGELOG.md
          fi

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          git add package.json CHANGELOG.md
          git commit -m "$TAG"
          git tag "$TAG"
          git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          NOTES_FILE=$(mktemp)
          printf "%b" "$NOTES" > "$NOTES_FILE"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
